function money(cents) {

async function api(path, opts) {
  opts = opts || {};
  const token = opts.token;
  const res = await fetch(API + path, {
    method: opts.method,
    body: opts.body,
    headers: Object.assign(
      { "Content-Type": "application/json" },
      token ? { Authorization: "Bearer " + token } : {},
      opts.headers || {}
    ),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Algo salió mal.");
  return data;
}

// Sube una foto o un video, sin importar de qué pantalla se llame.
// Fotos: pasan por nuestro backend (proxy hacia Bunny Storage).
// Videos: se suben directo desde el navegador a Bunny Stream (protocolo TUS),
// así los archivos grandes no consumen el ancho de banda de nuestro servidor.
// Corre (o reanuda) la subida TUS hacia Bunny Stream para un "sig" (datos de
// sesión de subida) ya obtenido. Si la conexión se corta a mitad de camino,
// tus-js-client guarda el progreso en el navegador y puede continuar desde
// ahí la próxima vez, en vez de volver a subir el archivo entero.
function runTusUpload(file, sig, onProgress, cacheKey) {
  return new Promise((resolve, reject) => {
    const upload = new tus.Upload(file, {
      endpoint: sig.tusEndpoint,
      retryDelays: [0, 1000, 3000, 5000],
      storeFingerprintForResuming: true,
      headers: {
        AuthorizationSignature: sig.signature,
        AuthorizationExpire: String(sig.expirationTime),
        VideoId: sig.videoId,
        LibraryId: String(sig.libraryId),
      },
      metadata: { filetype: file.type, title: file.name },
      onError: (err) => reject(err),
      onProgress: onProgress || function () {},
      onSuccess: () => {
        try { localStorage.removeItem(cacheKey); } catch (e) {}
        resolve({ url: sig.playbackUrl, mediaType: "video" });
      },
    });

    upload.findPreviousUploads().then((previousUploads) => {
      if (previousUploads.length > 0) upload.resumeFromPreviousUpload(previousUploads[0]);
      upload.start();
    });
  });
}

function uploadMedia(file, token, onProgress) {
  const isVideo = file.type.startsWith("video");

  if (!isVideo) {
    const formData = new FormData();
    formData.append("file", file);
    return fetch(API + "/uploads/image", {
      method: "POST",
      headers: { Authorization: "Bearer " + token },
      body: formData,
    }).then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "No se pudo subir la foto.");
      return { url: data.url, mediaType: "photo" };
    });
  }

  // Identificamos el archivo por nombre+tamaño+fecha de modificación, así si
  // se elige el MISMO video otra vez podemos recuperar los datos de la sesión
  // de subida anterior (mismo video de Bunny, misma firma) y reanudarla,
  // en vez de crear un video nuevo desde cero cada vez.
  const cacheKey = "deseo_video_upload_" + file.name + "_" + file.size + "_" + file.lastModified;

  const startFresh = () =>
    api("/uploads/video/init", { token: token, method: "POST" }).then((sig) => {
      try { localStorage.setItem(cacheKey, JSON.stringify(sig)); } catch (e) {}
      return runTusUpload(file, sig, onProgress, cacheKey);
    });

  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(cacheKey) || "null"); } catch (e) {}

  // La firma vence a la hora — si todavía es válida, intentamos reanudar.
  if (cached && cached.expirationTime > Math.floor(Date.now() / 1000) + 60) {
    return runTusUpload(file, cached, onProgress, cacheKey).catch(() => {
      try { localStorage.removeItem(cacheKey); } catch (e) {}
      return startFresh();
    });
  }

  try { localStorage.removeItem(cacheKey); } catch (e) {}
  return startFresh();
}

function ForgotPasswordScreen(props) {
  const [email, setEmail] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [sent, setSent] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!email) { setError("Escribe tu correo."); return; }
    setLoading(true);
    try {
      await api("/auth/forgot-password", { method: "POST", body: JSON.stringify({ email: email }) });
      setSent(true);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  if (sent) {
    return h("div", { style: { textAlign: "center" }, className: "fade-in" },
      h("p", { style: { color: colors.ink, fontSize: 14, marginBottom: 20, lineHeight: 1.6 } },
        "Si ese correo tiene una cuenta, te llegó un código de 6 dígitos. Revisa tu bandeja (y spam)."),
      h("button", { className: "btn-primary", onClick: () => props.onHaveCode(email), style: primaryButton }, "Ya tengo el código"),
      h("button", { className: "btn-ghost", onClick: props.onBack, style: Object.assign({}, toggleButton, { width: "100%", marginTop: 10 }) }, "Volver")
    );
  }

  return h("form", { onSubmit: submit, style: { display: "flex", flexDirection: "column", gap: 12 } },
    h("p", { style: { color: colors.muted, fontSize: 13, margin: "0 0 4px", lineHeight: 1.6 } }, "Escribe tu correo y te mandamos un código para recuperar tu contraseña."),
    h("input", { placeholder: "Correo electrónico", type: "email", value: email, onChange: (e) => setEmail(e.target.value), style: inputStyle }),
    error ? h("p", { style: { color: colors.red, fontSize: 13, margin: 0 } }, error) : null,
    h("button", { className: "btn-primary", type: "submit", disabled: loading, style: primaryButton }, loading ? "Enviando…" : "Enviar código"),
    h("button", { className: "btn-ghost", type: "button", onClick: props.onBack, style: Object.assign({}, toggleButton, { width: "100%" }) }, "Volver")
  );
}

function ResetPasswordScreen(props) {
  const [email, setEmail] = useState(props.email || "");
  const [code, setCode] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!email || !code || !newPassword) { setError("Completa todos los campos."); return; }
    setLoading(true);
    try {
      await api("/auth/reset-password", { method: "POST", body: JSON.stringify({ email: email, code: code, newPassword: newPassword }) });
      props.onDone();
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return h("form", { onSubmit: submit, style: { display: "flex", flexDirection: "column", gap: 12 } },
    h("input", { placeholder: "Correo electrónico", type: "email", value: email, onChange: (e) => setEmail(e.target.value), style: inputStyle }),
    h("input", { placeholder: "Código de 6 dígitos", value: code, onChange: (e) => setCode(e.target.value), style: Object.assign({}, inputStyle, { fontFamily: "'IBM Plex Mono', monospace", letterSpacing: 6, textAlign: "center" }), maxLength: 6 }),
    h("input", { placeholder: "Nueva contraseña", type: "password", value: newPassword, onChange: (e) => setNewPassword(e.target.value), style: inputStyle }),
    error ? h("p", { style: { color: colors.red, fontSize: 13, margin: 0 } }, error) : null,
    h("button", { className: "btn-primary", type: "submit", disabled: loading, style: primaryButton }, loading ? "Guardando…" : "Cambiar contraseña"),
    h("button", { className: "btn-ghost", type: "button", onClick: props.onBack, style: Object.assign({}, toggleButton, { width: "100%" }) }, "Volver")
  );
}

function AuthScreen(props) {
  const [mode, setMode] = useState("login");
  const [form, setForm] = useState({ username: "", email: "", password: "" });
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [notice, setNotice] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!form.email || !form.password || (mode === "register" && !form.username)) {
      setError("Completa todos los campos.");
      return;
    }
    setLoading(true);
    try {
      const path = mode === "login" ? "/auth/login" : "/auth/register";
      const body = mode === "login"
        ? { email: form.email, password: form.password }
        : { username: form.username, email: form.email, password: form.password };
      const data = await api(path, { method: "POST", body: JSON.stringify(body) });
      props.onAuthed(data.token, data.user);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return h("div", {
    style: {
      minHeight: "100vh",
      background: "radial-gradient(ellipse 1000px 600px at 50% -15%, rgba(198,150,63,0.14), transparent), radial-gradient(ellipse 700px 500px at 90% 110%, rgba(107,42,58,0.18), transparent), " + colors.bg,
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      padding: 24,
      fontFamily: "'Work Sans', sans-serif",
    }
  },
    h("div", { style: { width: "100%", maxWidth: 380 }, className: "fade-in" },
      h("div", { style: { textAlign: "center", marginBottom: 32 } },
        h(Logo, { size: 52 }),
        h(Ornament),
        h("p", { style: { color: colors.inkSoft, fontFamily: "'Fraunces', serif", fontStyle: "italic", fontSize: 16, margin: 0, opacity: 0.85 } }, "Tu deseo, tu precio")
      ),
      h("div", {
        style: {
          background: colors.bgRaised,
          border: "1px solid " + colors.border,
          borderRadius: 10,
          padding: "30px 26px",
          boxShadow: "0 20px 50px rgba(0,0,0,0.35)",
        }
      },
        (mode === "login" || mode === "register") ? h("div", { style: { display: "flex", marginBottom: 26, borderBottom: "1px solid " + colors.border } },
          ["login", "register"].map((m) =>
            h("button", {
              key: m,
              onClick: () => setMode(m),
              style: { flex: 1, background: "none", border: "none", padding: "10px 0", color: mode === m ? colors.ink : colors.muted, borderBottom: mode === m ? "2px solid " + colors.gold : "2px solid transparent", fontFamily: "'Work Sans', sans-serif", fontSize: 13, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", cursor: "pointer", transition: "color 0.15s ease" }
            }, m === "login" ? "Iniciar sesión" : "Crear cuenta")
          )
        ) : null,
        notice ? h("p", { style: { color: colors.green, fontSize: 13, textAlign: "center", marginBottom: 12 } }, notice) : null,
        mode === "forgot" ? h(ForgotPasswordScreen, {
          onBack: () => setMode("login"),
          onHaveCode: (email) => { setForm(Object.assign({}, form, { email: email })); setMode("reset"); }
        }) : mode === "reset" ? h(ResetPasswordScreen, {
          email: form.email,
          onBack: () => setMode("login"),
          onDone: () => { setNotice("Contraseña actualizada. Ya puedes iniciar sesión."); setMode("login"); }
        }) : h("form", { onSubmit: submit, style: { display: "flex", flexDirection: "column", gap: 12 } },
          mode === "register" ? h("input", {
            placeholder: "Nombre de usuario",
            value: form.username,
            onChange: (e) => setForm(Object.assign({}, form, { username: e.target.value })),
            style: inputStyle
          }) : null,
          h("input", {
            placeholder: "Correo electrónico",
            type: "email",
            value: form.email,
            onChange: (e) => setForm(Object.assign({}, form, { email: e.target.value })),
            style: inputStyle
          }),
          h("input", {
            placeholder: "Contraseña",
            type: "password",
            value: form.password,
            onChange: (e) => setForm(Object.assign({}, form, { password: e.target.value })),
            style: inputStyle
          }),
          error ? h("p", { style: { color: colors.red, fontSize: 13, margin: 0 } }, error) : null,
          h("button", { className: "btn-primary", type: "submit", disabled: loading, style: primaryButton },
            loading ? "Un momento…" : mode === "login" ? "Entrar" : "Crear mi cuenta"
          ),
          mode === "login" ? h("button", {
            type: "button",
            onClick: () => setMode("forgot"),
            style: { background: "none", border: "none", color: colors.muted, fontSize: 13, cursor: "pointer", textAlign: "center", marginTop: 4 }
          }, "¿Olvidaste tu contraseña?") : null
        )
      ),
      h("p", { style: { textAlign: "center", color: colors.mutedDeep, fontSize: 11, letterSpacing: "0.14em", marginTop: 28 } }, "DESEO · CONTENIDO CON DUEÑO")
    )
  );
}

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "ahora";
  if (mins < 60) return mins + " min";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + " h";
  const days = Math.floor(hrs / 24);
  return days + " d";
}

function renderCommentContent(text, onOpenProfile, token) {
  const parts = text.split(/(@[a-zA-Z0-9_]{1,30})/g);
  return parts.map((part, i) => {
    if (/^@[a-zA-Z0-9_]{1,30}$/.test(part)) {
      return h("span", {
        key: i, style: { color: colors.gold, cursor: "pointer" },
        onClick: () => {
          api("/auth/username/" + part.slice(1), { token: token })
            .then((d) => onOpenProfile && onOpenProfile(d.user.id))
            .catch(() => {});
        }
      }, part);
    }
    return part;
  });
}

function CommentSection(props) {
  const postId = props.postId;
  const token = props.token;
  const onCountChange = props.onCountChange;
  const [open, setOpen] = useState(false);
  const [comments, setComments] = useState([]);
  const [loading, setLoading] = useState(false);
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [mentionQuery, setMentionQuery] = useState(null);
  const [mentionResults, setMentionResults] = useState([]);

  const handleTextChange = (e) => {
    const val = e.target.value;
    setText(val);
    const cursor = e.target.selectionStart;
    const upToCursor = val.slice(0, cursor);
    const match = upToCursor.match(/@([a-zA-Z0-9_]{0,30})$/);
    if (match) {
      setMentionQuery(match[1]);
    } else {
      setMentionQuery(null);
      setMentionResults([]);
    }
  };

  useEffect(() => {
    if (mentionQuery === null || mentionQuery.length < 1) { setMentionResults([]); return; }
    const handle = setTimeout(() => {
      api("/search?q=" + encodeURIComponent(mentionQuery), { token: token })
        .then((d) => setMentionResults((d.users || []).slice(0, 5)))
        .catch(() => {});
    }, 250);
    return () => clearTimeout(handle);
  }, [mentionQuery, token]);

  const pickMention = (username) => {
    const replaced = text.replace(/@([a-zA-Z0-9_]{0,30})$/, "@" + username + " ");
    setText(replaced);
    setMentionQuery(null);
    setMentionResults([]);
  };

  const load = async () => {
    setLoading(true);
    setError("");
    try {
      const data = await api("/posts/" + postId + "/comments?limit=50", { token: token });
      setComments(data.comments || []);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  const toggle = () => {
    const next = !open;
    setOpen(next);
    if (next && comments.length === 0) load();
  };

  const send = async (e) => {
    e.preventDefault();
    const trimmed = text.trim();
    if (!trimmed) return;
    setSending(true);
    setError("");
    try {
      const data = await api("/posts/" + postId + "/comments", { token: token, method: "POST", body: JSON.stringify({ content: trimmed }) });
      setComments([data.comment, ...comments]);
      setText("");
      if (onCountChange) onCountChange(1);
    } catch (err) {
      setError(err.message);
    } finally {
      setSending(false);
    }
  };

  const remove = async (commentId) => {
    try {
      await api("/posts/" + postId + "/comments/" + commentId, { token: token, method: "DELETE" });
      setComments(comments.filter((c) => c.id !== commentId));
      if (onCountChange) onCountChange(-1);
    } catch (err) {
      setError(err.message);
    }
  };

function PostCard(props) {
  const post = props.post;
  const token = props.token;
  const [reacting, setReacting] = useState(false);
  const [commentCount, setCommentCount] = useState(post.commentCount || 0);
  const [saved, setSaved] = useState(!!post.saved);
  const [savingToggle, setSavingToggle] = useState(false);
  const [showHeartAnim, setShowHeartAnim] = useState(false);
  const [reposted, setReposted] = useState(!!post.reposted);
  const [reposting, setReposting] = useState(false);
  const [deleted, setDeleted] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const lastTapRef = React.useRef(0);
  const myReaction = post.myReaction;

  const deletePost = async () => {
    if (!window.confirm("¿Borrar esta publicación? No se puede deshacer.")) return;
    setDeleting(true);
    try {
      await api("/posts/" + post.id, { token: token, method: "DELETE" });
      setDeleted(true);
      props.onReacted && props.onReacted();
    } catch (e) {
      setDeleting(false);
    }
  };

  const toggleRepost = async () => {
    setReposting(true);
    try {
      if (reposted) await api("/posts/" + post.id + "/repost", { token: token, method: "DELETE" });
      else await api("/posts/" + post.id + "/repost", { token: token, method: "POST" });
      setReposted(!reposted);
    } catch (e) {} finally { setReposting(false); }
  };

  const handleMediaTap = () => {
    const now = Date.now();
    if (now - lastTapRef.current < 300) {
      setShowHeartAnim(true);
      setTimeout(() => setShowHeartAnim(false), 700);
      if (myReaction !== "love") react("love");
      lastTapRef.current = 0;
    } else {
      lastTapRef.current = now;
    }
  };

  const toggleSave = async () => {
    setSavingToggle(true);
    try {
      if (saved) await api("/posts/" + post.id + "/save", { token: token, method: "DELETE" });
      else await api("/posts/" + post.id + "/save", { token: token, method: "POST" });
      setSaved(!saved);
    } catch (e) {} finally { setSavingToggle(false); }
  };

  const react = async (type) => {
    setReacting(true);
    try {
      await api("/posts/" + post.id + "/reaction", { token: token, method: "PUT", body: JSON.stringify({ reactionType: myReaction === type ? null : type }) });
      props.onReacted();
    } catch (e) {} finally {
      setReacting(false);
    }
  };

  if (deleted) return null;

  return h("div", { className: "post-card", style: { background: colors.bgRaised, border: "1px solid " + colors.border, borderRadius: 8, overflow: "hidden", marginBottom: 18 } },
    post.repostedBy ? h("div", {
      style: { padding: "10px 16px 0", color: colors.muted, fontSize: 12, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" },
      onClick: () => props.onOpenProfile && props.onOpenProfile(post.repostedBy.id)
    }, "🔁 Repostado por @" + post.repostedBy.username) : null,
    post.repostComment ? h("p", { style: { padding: "6px 16px 0", color: colors.inkSoft, fontSize: 13, margin: 0 } }, post.repostComment) : null,
    h("div", { style: { padding: "13px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" } },
      h("span", {
        style: { color: colors.ink, fontFamily: "'Work Sans', sans-serif", fontSize: 14, fontWeight: 500, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4 },
        onClick: () => props.onOpenProfile && props.onOpenProfile(post.authorId)
      }, "@" + post.author, post.authorVerified ? h("span", { key: "v", style: { color: colors.gold, fontSize: 12 }, title: "Cuenta verificada" }, "✓") : null),
      h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
        post.priceCents > 0 ? h(TicketPrice, { cents: post.priceCents }) : null,
        props.myUserId && props.myUserId === post.authorId
          ? h("button", {
              onClick: deletePost, disabled: deleting, title: "Borrar publicación",
              style: { background: "transparent", border: "none", color: colors.muted, fontSize: 16, cursor: "pointer", padding: 0 }
            }, deleting ? "…" : "🗑")
          : null,
        h("button", {
          onClick: toggleRepost, disabled: reposting, title: reposted ? "Deshacer repost" : "Repostear",
          style: { background: "transparent", border: "none", color: reposted ? colors.gold : colors.muted, fontSize: 16, cursor: "pointer", padding: 0 }
        }, "🔁"),
        h("button", {
          onClick: toggleSave, disabled: savingToggle, title: saved ? "Quitar de guardados" : "Guardar",
          style: { background: "transparent", border: "none", color: saved ? colors.gold : colors.muted, fontSize: 16, cursor: "pointer", padding: 0 }
        }, "🔖")
      )
    ),
    post.mediaType ? h("div", {
      style: { height: 280, background: colors.bgDeep, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" },
      onContextMenu: blockContextMenu,
      onClick: handleMediaTap
    },
      showHeartAnim ? h("div", { style: { position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none", zIndex: 2 } },
        h("span", { className: "heart-pop", style: { fontSize: 70, color: "#fff", textShadow: "0 2px 14px rgba(0,0,0,0.6)" } }, "♥")
      ) : null,
      post.unlocked && post.mediaUrl
        ? (post.mediaType === "video"
            ? h("video", {
                src: post.mediaUrl,
                controls: true,
                controlsList: "nodownload noremoteplayback",
                disablePictureInPicture: true,
                onContextMenu: blockContextMenu,
                className: "media-protected",
                style: { maxHeight: "100%", maxWidth: "100%" }
              })
            : h("img", {
                src: post.mediaUrl,
                alt: "",
                draggable: false,
                onContextMenu: blockContextMenu,
                className: "media-protected",
                style: { maxHeight: "100%", maxWidth: "100%", objectFit: "contain" }
              }))
        : h("div", { style: { textAlign: "center", color: colors.muted, fontFamily: "'Work Sans', sans-serif" } },
            h("div", { style: { fontSize: 30, marginBottom: 8, color: colors.gold } }, "\u25D0"),
            h("div", { style: { fontSize: 13, letterSpacing: "0.04em" } }, "Contenido bloqueado")
          )
    ) : null,
    post.caption ? h("p", { style: { padding: "13px 16px 4px", color: colors.ink, fontFamily: "'Work Sans', sans-serif", fontSize: 14, margin: 0, lineHeight: 1.5 } }, post.caption) : null,
    h("div", { style: { display: "flex", gap: 4, padding: "11px 16px 14px", flexWrap: "wrap" } },
      REACTIONS.map((r) =>
        h("button", {
          key: r.key,
          className: "reaction-btn",
          onClick: () => react(r.key),
          disabled: reacting,
          title: r.label,
          style: { background: myReaction === r.key ? colors.gold : "transparent", border: "1px solid " + colors.border, borderRadius: 4, padding: "4px 8px", color: myReaction === r.key ? "#1A1112" : colors.muted, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }
        },
          h("span", null, r.glyph),
          h("span", { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 } }, (post.reactions && post.reactions[r.key]) || 0)
        )
      )
    ),
    h(CommentSection, {
      postId: post.id,
      token: token,
      count: commentCount,
      onCountChange: (delta) => setCommentCount((c) => c + delta),
      onOpenProfile: props.onOpenProfile
    })
  );
}

function CreatePostScreen(props) {
  const token = props.token;
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [caption, setCaption] = useState("");
  const [isFree, setIsFree] = useState(true);
  const [price, setPrice] = useState("3.00");
  const [uploading, setUploading] = useState(false);
  const [uploadPct, setUploadPct] = useState(0);
  const [error, setError] = useState("");

  const pickFile = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    setFile(f);
    setPreview(URL.createObjectURL(f));
  };

  useEffect(() => {
    if (!uploading) return;
    const warn = (e) => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", warn);
    return () => window.removeEventListener("beforeunload", warn);
  }, [uploading]);

  const submit = async () => {
    setError("");
    if (!file && !caption.trim()) { setError("Agrega una foto/video o escribe algo de texto."); return; }
    if (!file && !isFree) { setError("Las publicaciones de solo texto deben ser gratuitas."); return; }
    if (!isFree && (!price || Number(price) <= 0)) { setError("Ponle un precio válido, o marca la publicación como gratuita."); return; }
    setUploading(true);
    setUploadPct(0);
    try {
      let mediaUrl = null;
      let mediaType = null;
      if (file) {
        const uploaded = await uploadMedia(file, token, (sent, total) => setUploadPct(Math.round((sent / total) * 100)));
        mediaUrl = uploaded.url;
        mediaType = uploaded.mediaType;
      }
      await api("/posts", { token: token, method: "POST", body: JSON.stringify({ caption: caption, mediaUrl: mediaUrl, mediaType: mediaType, isFree: isFree, priceCents: isFree ? 0 : Math.round(Number(price) * 100) }) });
      props.onCreated();
    } catch (err) {
      setError(err.message);
    } finally {
      setUploading(false);
    }
  };

  return h("div", { style: { padding: 20, fontFamily: "'Work Sans', sans-serif" } },
    h("h2", { style: { fontFamily: "'Fraunces', serif", fontStyle: "italic", color: colors.ink, fontWeight: 600, fontSize: 26, marginBottom: 20 } }, "Nueva publicación"),
    h("label", { style: { display: "flex", alignItems: "center", justifyContent: "center", height: 200, background: colors.bgRaised, border: "1px dashed " + colors.border, borderRadius: 8, cursor: "pointer", marginBottom: 16, overflow: "hidden" } },
      preview
        ? (file && file.type.startsWith("video")
            ? h("video", { src: preview, style: { maxHeight: "100%", maxWidth: "100%" } })
            : h("img", { src: preview, alt: "", style: { maxHeight: "100%", maxWidth: "100%", objectFit: "contain" } }))
        : h("span", { style: { color: colors.muted, fontSize: 14 } }, "Toca para elegir foto o video (opcional)"),
      h("input", { type: "file", accept: "image/*,video/*", onChange: pickFile, style: { display: "none" } })
    ),
    h("textarea", { placeholder: "Escribe una descripción…", value: caption, onChange: (e) => setCaption(e.target.value), rows: 3, style: Object.assign({}, inputStyle, { resize: "vertical", marginBottom: 16 }) }),
    h("div", { style: { display: "flex", alignItems: "center", gap: 12, marginBottom: 16 } },
      h("button", { className: "btn-ghost", onClick: () => setIsFree(true), style: Object.assign({}, toggleButton, { background: isFree ? colors.gold : "transparent", color: isFree ? "#1A1112" : colors.muted, borderColor: isFree ? colors.gold : colors.border }) }, "Gratis"),
      h("button", { className: "btn-ghost", onClick: () => setIsFree(false), disabled: !file, title: file ? "" : "Las publicaciones de solo texto deben ser gratuitas", style: Object.assign({}, toggleButton, { background: !isFree ? colors.gold : "transparent", color: !isFree ? "#1A1112" : colors.muted, borderColor: !isFree ? colors.gold : colors.border, opacity: file ? 1 : 0.4, cursor: file ? "pointer" : "not-allowed" }) }, "De pago"),
      !isFree ? h("input", { type: "number", min: "0.5", step: "0.5", value: price, onChange: (e) => setPrice(e.target.value), style: Object.assign({}, inputStyle, { width: 90 }) }) : null
    ),
    error ? h("p", { style: { color: colors.red, fontSize: 13 } }, error) : null,
    uploading && file && file.type.startsWith("video")
      ? h("div", { style: { marginBottom: 10 } },
          h("div", { style: { height: 6, background: colors.bgDeep, borderRadius: 4, overflow: "hidden" } },
            h("div", { style: { height: "100%", width: uploadPct + "%", background: colors.gold, transition: "width 0.2s" } })
          ),
          h("p", { style: { color: colors.gold, fontSize: 12, margin: "6px 0 0", textAlign: "center" } }, "No cierres esta pantalla ni cambies de app mientras se sube el video.")
        )
      : null,
    h("div", { style: { display: "flex", gap: 10 } },
      h("button", { className: "btn-ghost", onClick: props.onCancel, disabled: uploading, style: Object.assign({}, toggleButton, { flex: 1, opacity: uploading ? 0.5 : 1 }) }, "Cancelar"),
      h("button", { className: "btn-primary", onClick: submit, disabled: uploading, style: Object.assign({}, primaryButton, { flex: 2, marginTop: 0 }) }, uploading ? (file && file.type.startsWith("video") ? "Subiendo… " + uploadPct + "%" : "Publicando…") : "Publicar")
    )
  );
}

function FriendButton(props) {
  const { status, requestId, busy, onSendRequest, onAccept, onDecline, onCancel, onUnfriend } = props;

  if (status === "loading") {
    return h("button", { className: "btn-ghost", disabled: true, style: Object.assign({}, toggleButton, { padding: "9px 16px" }) }, "…");
  }
  if (status === "friends") {
    return h("button", {
      className: "btn-ghost", disabled: busy, onClick: () => onUnfriend(),
      style: Object.assign({}, toggleButton, { padding: "9px 16px" })
    }, busy ? "…" : "Amigos ✕");
  }
  if (status === "pending_sent") {
    return h("button", {
      className: "btn-ghost", disabled: busy, onClick: () => onCancel(requestId),
      style: Object.assign({}, toggleButton, { padding: "9px 16px" })
    }, busy ? "…" : "Solicitud enviada");
  }
  if (status === "pending_received") {
    return h("div", { style: { display: "flex", gap: 8 } },
      h("button", { className: "btn-primary", disabled: busy, onClick: () => onAccept(requestId), style: Object.assign({}, primaryButton, { margin: 0, padding: "9px 16px" }) }, busy ? "…" : "Aceptar"),
      h("button", { className: "btn-ghost", disabled: busy, onClick: () => onDecline(requestId), style: Object.assign({}, toggleButton, { padding: "9px 16px" }) }, "Rechazar")
    );
  }
  return h("button", {
    className: "btn-primary", disabled: busy, onClick: () => onSendRequest(),
    style: Object.assign({}, primaryButton, { margin: 0, padding: "9px 16px" })
  }, busy ? "…" : "Agregar amigo");
}

function ProfileScreen(props) {
  const { userId, token, currentUser, onBack, onOpenChat, allPosts } = props;
  const isMe = currentUser && currentUser.id === userId;

  const [profile, setProfile] = useState(null);
  const [tab, setTab] = useState("posts");
  const [friendStatus, setFriendStatus] = useState("loading");
  const [requestId, setRequestId] = useState(null);
  const [friendBusy, setFriendBusy] = useState(false);
  const [friendsList, setFriendsList] = useState(null);
  const [friendsCount, setFriendsCount] = useState(null);
  const [error, setError] = useState("");
  const [blockedByMe, setBlockedByMe] = useState(false);
  const [showMenu, setShowMenu] = useState(false);
  const [showReport, setShowReport] = useState(false);
  const [savedPosts, setSavedPosts] = useState(null);
  const [suggestions, setSuggestions] = useState(null);
  const [sentTo, setSentTo] = useState({});
  const [subActive, setSubActive] = useState(false);
  const [subExpiresAt, setSubExpiresAt] = useState(null);
  const [subscribing, setSubscribing] = useState(false);
  const [subError, setSubError] = useState("");

  const load = useCallback(async () => {
    setError("");
    try {
      const data = isMe
        ? { user: currentUser }
        : await api("/auth/user/" + userId, { token: token });
      setProfile(data.user);
    } catch (e) {
      setError(e.message);
    }
    try {
      const fr = await api("/friends?userId=" + userId, { token: token });
      setFriendsCount((fr.friends || []).length);
      setFriendsList(fr.friends || []);
    } catch (e) {}
    if (!isMe) {
      try {
        const st = await api("/friends/status/" + userId, { token: token });
        setFriendStatus(st.status);
        setRequestId(st.requestId || null);
      } catch (e) {
        setFriendStatus("none");
      }
      try {
        const bs = await api("/moderation/block/status/" + userId, { token: token });
        setBlockedByMe(bs.blockedByMe);
      } catch (e) {}
      try {
        const ms = await api("/payments/membership/status/" + userId, { token: token });
        setSubActive(ms.active);
        setSubExpiresAt(ms.expiresAt);
      } catch (e) {}
    }
  }, [userId, token, isMe, currentUser]);

  useEffect(() => { load(); }, [load]);

  const friendAction = async (fn) => {
    setFriendBusy(true);
    try { await fn(); await load(); } catch (e) { setError(e.message); } finally { setFriendBusy(false); }
  };

  const sendSuggestionRequest = async (suggestedId) => {
    try {
      await api("/friends/request/" + suggestedId, { token: token, method: "POST" });
      setSentTo((prev) => Object.assign({}, prev, { [suggestedId]: true }));
    } catch (e) {}
  };

  const sendRequest = () => friendAction(() => api("/friends/request/" + userId, { token: token, method: "POST" }));
  const acceptRequest = (id) => friendAction(() => api("/friends/accept/" + id, { token: token, method: "POST" }));
  const declineRequest = (id) => friendAction(() => api("/friends/decline/" + id, { token: token, method: "POST" }));
  const cancelRequest = (id) => friendAction(() => api("/friends/request/" + id, { token: token, method: "DELETE" }));
  const unfriend = () => friendAction(() => api("/friends/" + userId, { token: token, method: "DELETE" }));

  const subscribe = async () => {
    setSubscribing(true);
    setSubError("");
    try {
      const result = await api("/payments/membership/" + userId, { token: token, method: "POST" });
      if (result.paymentUrl) window.open(result.paymentUrl, "_blank");
    } catch (e) {
      setSubError(e.message);
    } finally {
      setSubscribing(false);
    }
  };

  const toggleBlock = async () => {
    setShowMenu(false);
    try {
      if (blockedByMe) {
        await api("/moderation/block/" + userId, { token: token, method: "DELETE" });
      } else {
        await api("/moderation/block/" + userId, { token: token, method: "POST" });
      }
      await load();
    } catch (e) { setError(e.message); }
  };

  const submitReport = async (reason) => {
    await api("/moderation/report", { token: token, method: "POST", body: JSON.stringify({ reportedUserId: userId, reason: reason }) });
  };

  const openChat = async () => {
    try {
      const data = await api("/chat/conversations", { token: token, method: "POST", body: JSON.stringify({ withUserId: userId }) });
      onOpenChat(data.conversationId, profile ? profile.username : "", userId);
    } catch (e) { setError(e.message); }
  };

  if (!profile) {
    return h("div", { style: { padding: 40, textAlign: "center", color: colors.muted } }, error || "Cargando perfil…");
  }

  const myPosts = (allPosts || []).filter((p) => p.authorId === userId);

  return h("div", { style: { maxWidth: 560, margin: "0 auto" } },
    h("button", { className: "btn-ghost", onClick: onBack, style: Object.assign({}, toggleButton, { margin: "16px 0 0 16px", padding: "6px 12px" }) }, "← Volver"),

    h("div", { style: { height: 170, background: profile.coverPhotoUrl ? "url(" + profile.coverPhotoUrl + ") center/cover" : "linear-gradient(135deg, " + colors.wine + ", " + colors.bgDeep + ")", margin: "12px 16px 0", borderRadius: 8 } }),

    h("div", { style: { padding: "0 20px", marginTop: -36, display: "flex", alignItems: "flex-end", gap: 16 } },
      h(Avatar, { url: profile.avatarUrl, username: profile.username, size: 84 }),
      h("div", { style: { flex: 1, paddingBottom: 4 } },

function presenceLabel(lastSeenAt) {
  if (!lastSeenAt) return { online: false, text: "Sin conexión reciente" };
  const diffMs = Date.now() - new Date(lastSeenAt).getTime();
  if (diffMs < 60000) return { online: true, text: "En línea" };
  return { online: false, text: "Visto " + timeAgo(lastSeenAt) };
}

function ChatScreen(props) {
  const { conversationId, otherUsername, otherUserId, token, onBack } = props;
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [loading, setLoading] = useState(true);
  const [uploadingMedia, setUploadingMedia] = useState(false);
  const [error, setError] = useState("");
  const [presence, setPresence] = useState(null);
  const [otherLastReadAt, setOtherLastReadAt] = useState(null);
  const [isTyping, setIsTyping] = useState(false);
  const socketRef = React.useRef(null);
  const typingTimeoutRef = React.useRef(null);
  const lastTypingSentRef = React.useRef(0);

  useEffect(() => {
    if (!otherUserId) return;
    const loadPresence = () => api("/auth/user/" + otherUserId, { token: token }).then((d) => setPresence(d.user.lastSeenAt)).catch(() => {});
    loadPresence();
    const iv = setInterval(loadPresence, 20000);
    return () => clearInterval(iv);
  }, [otherUserId, token]);

  const markRead = useCallback(() => {
    api("/chat/conversations/" + conversationId + "/read", { token: token, method: "POST" }).catch(() => {});
  }, [conversationId, token]);

  // Conexión al socket para mensajes en tiempo real e indicador de "escribiendo…".
  useEffect(() => {
    const socket = io(SOCKET_URL, { auth: { token: token } });
    socketRef.current = socket;

    socket.on("connect", () => socket.emit("conversation:join", conversationId));

    socket.on("message:new", (msg) => {
      if (msg.conversation_id !== conversationId) return;
      setMessages((prev) => (prev.some((m) => m.id === msg.id) ? prev : prev.concat([msg])));
      if (msg.sender_id !== props.myUserId) markRead();
    });

    socket.on("typing", ({ conversationId: cid }) => {
      if (cid !== conversationId) return;
      setIsTyping(true);
      clearTimeout(typingTimeoutRef.current);
      typingTimeoutRef.current = setTimeout(() => setIsTyping(false), 3000);
    });

    return () => {
      clearTimeout(typingTimeoutRef.current);
      socket.disconnect();
    };
  }, [conversationId, token, markRead, props.myUserId]);

  const notifyTyping = () => {
    const now = Date.now();
    if (now - lastTypingSentRef.current < 2000) return;
    lastTypingSentRef.current = now;
    if (socketRef.current) socketRef.current.emit("typing", { conversationId: conversationId });
  };

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const data = await api("/chat/conversations/" + conversationId + "/messages", { token: token });
      setMessages(data.messages || []);
      setOtherLastReadAt(data.otherLastReadAt || null);
    } catch (e) {} finally { setLoading(false); }
  }, [conversationId, token]);

  useEffect(() => { load().then(markRead); }, [load, markRead]);

  const send = async (e) => {
    e.preventDefault();
    if (!text.trim() || sending) return;
    setSending(true);
    try {
      await api("/chat/conversations/" + conversationId + "/messages", { token: token, method: "POST", body: JSON.stringify({ content: text.trim() }) });
      setText("");
      await load();
    } catch (e) {} finally { setSending(false); }
  };

  const pickMedia = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setError("");
    setUploadingMedia(true);
    try {
      const uploaded = await uploadMedia(file, token);
      await api("/chat/conversations/" + conversationId + "/messages", {
        token: token, method: "POST",
        body: JSON.stringify({ mediaUrl: uploaded.url, mediaType: uploaded.mediaType })
      });
      await load();
    } catch (err) {
      setError(err.message);
    } finally {
      setUploadingMedia(false);
    }
  };

  return h("div", { style: { maxWidth: 480, margin: "0 auto", display: "flex", flexDirection: "column", height: "calc(100vh - 70px)" } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderBottom: "1px solid " + colors.border } },
      h("button", { className: "btn-ghost", onClick: onBack, style: Object.assign({}, toggleButton, { padding: "6px 10px" }) }, "←"),
      h("div", null,
        h("span", { style: { color: colors.ink, fontFamily: "'Fraunces', serif", fontStyle: "italic", fontSize: 17, display: "block" } }, "@" + otherUsername),
        isTyping
          ? h("span", { style: { color: colors.gold, fontSize: 11, fontStyle: "italic" } }, "escribiendo…")
          : (otherUserId ? (() => {
              const p = presenceLabel(presence);
              return h("span", { style: { color: p.online ? colors.gold : colors.muted, fontSize: 11, display: "flex", alignItems: "center", gap: 4 } },
                p.online ? h("span", { style: { width: 6, height: 6, borderRadius: "50%", background: colors.gold, display: "inline-block" } }) : null,
                p.text
              );
            })() : null)
      )
    ),
    h("div", { style: { flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 8 } },
      loading ? h("p", { style: { color: colors.muted, textAlign: "center" } }, "Cargando…") : null,
      messages.map((m, i) => {
        const mine = m.sender_id === props.myUserId;
        const isLastMine = mine && !messages.slice(i + 1).some((mm) => mm.sender_id === props.myUserId);
        const wasRead = otherLastReadAt && new Date(m.created_at) <= new Date(otherLastReadAt);
        return h("div", {
          key: m.id,
          style: { alignSelf: mine ? "flex-end" : "flex-start", maxWidth: "75%", display: "flex", flexDirection: "column", gap: 4 }
        },
          m.media_url
            ? h("div", { style: { borderRadius: 10, overflow: "hidden", border: "1px solid " + colors.border }, onContextMenu: blockContextMenu },
                m.media_type === "video"
                  ? h("video", { src: m.media_url, controls: true, controlsList: "nodownload noremoteplayback", disablePictureInPicture: true, onContextMenu: blockContextMenu, className: "media-protected", style: { maxWidth: "100%", maxHeight: 260, display: "block" } })
                  : h("img", { src: m.media_url, alt: "", draggable: false, onContextMenu: blockContextMenu, className: "media-protected", style: { maxWidth: "100%", maxHeight: 260, display: "block", objectFit: "cover" } })
              )
            : null,
          m.content ? h("div", {
            style: {
              background: mine ? colors.gold : colors.bgRaised,
              color: mine ? "#1A1112" : colors.ink,
              padding: "8px 12px", borderRadius: 10, fontSize: 14
            }
          }, m.content) : null,
          isLastMine ? h("span", { style: { color: colors.muted, fontSize: 11, alignSelf: "flex-end" } }, wasRead ? "Visto" : "Enviado") : null
        );
      })
    ),
    error ? h("p", { style: { color: colors.red, fontSize: 12, padding: "0 16px" } }, error) : null,
    h("form", { onSubmit: send, style: { display: "flex", gap: 8, padding: 14, borderTop: "1px solid " + colors.border, alignItems: "center" } },
      h("label", {
        style: { cursor: "pointer", color: colors.gold, fontSize: 20, padding: "4px 6px", opacity: uploadingMedia ? 0.5 : 1 },
        title: "Enviar foto o video"
      },
        uploadingMedia ? "…" : "📎",
        h("input", { type: "file", accept: "image/*,video/*", onChange: pickMedia, disabled: uploadingMedia, style: { display: "none" } })
      ),
      h("input", { style: Object.assign({}, inputStyle, { padding: "10px 12px" }), placeholder: "Escribe un mensaje…", value: text, onChange: (e) => { setText(e.target.value); notifyTyping(); } }),
      h("button", { className: "btn-primary", type: "submit", disabled: sending || !text.trim(), style: Object.assign({}, primaryButton, { margin: 0, padding: "10px 16px" }) }, "Enviar")
    )
  );
}

function ImagePicker(props) {
  // props: label, value (url actual), onUploaded(url), token, height, shape ("circle"|"rect")
  const [uploading, setUploading] = useState(false);
  const [preview, setPreview] = useState(props.value || null);
  const [error, setError] = useState("");

  const pick = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    setPreview(URL.createObjectURL(file));
    setUploading(true);
    try {
      const uploaded = await uploadMedia(file, props.token);
      props.onUploaded(uploaded.url);
    } catch (err) {
      setError(err.message);
    } finally {
      setUploading(false);
    }
  };

  const isCircle = props.shape === "circle";

  return h("div", null,
    h("label", {
      style: {
        display: "flex", alignItems: "center", justifyContent: "center",
        height: props.height || 140, width: isCircle ? (props.height || 140) : "100%",
        borderRadius: isCircle ? "50%" : 8,
        background: preview ? "url(" + preview + ") center/cover" : colors.bgRaised,
        border: "1px dashed " + colors.border, cursor: "pointer", overflow: "hidden", position: "relative"
      }
    },
      !preview ? h("span", { style: { color: colors.muted, fontSize: 13, textAlign: "center", padding: 8 } }, props.label) : null,
      uploading ? h("span", { style: { position: "absolute", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", color: colors.ink, fontSize: 12 } }, "Subiendo…") : null,
      h("input", { type: "file", accept: "image/*", onChange: pick, style: { display: "none" } })
    ),
    error ? h("p", { style: { color: colors.red, fontSize: 12, marginTop: 4 } }, error) : null
  );
}

function EditProfileScreen(props) {
  const { token, user, onCancel, onSaved } = props;
  const [avatarUrl, setAvatarUrl] = useState(user.avatarUrl || null);
  const [coverPhotoUrl, setCoverPhotoUrl] = useState(user.coverPhotoUrl || null);
  const [bio, setBio] = useState(user.bio || "");
  const [location, setLocation] = useState(user.location || "");
  const [relationshipStatus, setRelationshipStatus] = useState(user.relationshipStatus || "");
  const [membershipPrice, setMembershipPrice] = useState(user.membershipPriceCents ? (user.membershipPriceCents / 100).toFixed(2) : "");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const save = async () => {
    setSaving(true);
    setError("");
    try {
      const membershipPriceCents = membershipPrice.trim() === "" ? 0 : Math.round(Number(membershipPrice) * 100);
      const data = await api("/auth/me", {
        token: token, method: "PATCH",
        body: JSON.stringify({ avatarUrl: avatarUrl, coverPhotoUrl: coverPhotoUrl, bio: bio, location: location, relationshipStatus: relationshipStatus, membershipPriceCents: membershipPriceCents })
      });
      onSaved(data.user);
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { style: { maxWidth: 480, margin: "0 auto", padding: 20 } },
    h("h2", { style: { fontFamily: "'Fraunces', serif", fontStyle: "italic", color: colors.ink, fontSize: 24, marginBottom: 20 } }, "Editar perfil"),

    h("p", { style: { color: colors.muted, fontSize: 13, marginBottom: 6 } }, "Foto de portada"),
    h(ImagePicker, { label: "Toca para elegir portada", value: coverPhotoUrl, onUploaded: setCoverPhotoUrl, token: token, height: 130, shape: "rect" }),

    h("p", { style: { color: colors.muted, fontSize: 13, margin: "18px 0 6px" } }, "Foto de perfil"),
    h(ImagePicker, { label: "Elegir", value: avatarUrl, onUploaded: setAvatarUrl, token: token, height: 92, shape: "circle" }),

    h("p", { style: { color: colors.muted, fontSize: 13, margin: "18px 0 6px" } }, "Biografía"),
    h("textarea", { value: bio, onChange: (e) => setBio(e.target.value), rows: 3, placeholder: "Contá algo sobre vos…", style: Object.assign({}, inputStyle, { resize: "vertical" }) }),

    h("p", { style: { color: colors.muted, fontSize: 13, margin: "18px 0 6px" } }, "Ubicación"),
    h("input", { value: location, onChange: (e) => setLocation(e.target.value), placeholder: "Ej. San Salvador, El Salvador", style: inputStyle }),

    h("p", { style: { color: colors.muted, fontSize: 13, margin: "18px 0 6px" } }, "Estado sentimental"),
    h("input", { value: relationshipStatus, onChange: (e) => setRelationshipStatus(e.target.value), placeholder: "Ej. Soltera, En una relación…", style: inputStyle }),

    h("p", { style: { color: colors.muted, fontSize: 13, margin: "18px 0 6px" } }, "Precio de membresía mensual (USD)"),
    h("input", { type: "number", step: "0.01", min: "0", value: membershipPrice, onChange: (e) => setMembershipPrice(e.target.value), placeholder: "Ej. 9.99 (dejar vacío para no ofrecer membresía)", style: inputStyle }),
    h("p", { style: { color: colors.muted, fontSize: 12, margin: "4px 0 0" } }, "Quien se suscribe ve automáticamente todas tus publicaciones de pago durante 30 días."),

    error ? h("p", { style: { color: colors.red, fontSize: 13, marginTop: 12 } }, error) : null,

    h("div", { style: { display: "flex", gap: 10, marginTop: 22 } },
      h("button", { className: "btn-ghost", onClick: onCancel, style: Object.assign({}, toggleButton, { flex: 1 }) }, "Cancelar"),
      h("button", { className: "btn-primary", onClick: save, disabled: saving, style: Object.assign({}, primaryButton, { flex: 2, marginTop: 0 }) }, saving ? "Guardando…" : "Guardar cambios")
    )
  );
}

function notificationText(n) {
  if (n.type === "friend_request") return "@" + n.actor_username + " te envió una solicitud de amistad";
  if (n.type === "friend_accepted") return "@" + n.actor_username + " aceptó tu solicitud de amistad";
  if (n.type === "new_comment") return "@" + n.actor_username + " comentó tu publicación";
  return "@" + n.actor_username + " publicó algo nuevo";
}

function NotificationBell(props) {
  const { token, onOpenProfile } = props;
  const [open, setOpen] = useState(false);
  const [items, setItems] = useState([]);
  const [unread, setUnread] = useState(0);

  const load = useCallback(async () => {
    try {
      const data = await api("/notifications", { token: token });
      setItems(data.notifications || []);
      setUnread(data.unreadCount || 0);

function StoryViewer(props) {
  const { authorId, token, myUserId, onClose } = props;
  const [stories, setStories] = useState(null);
  const [index, setIndex] = useState(0);
  const [progress, setProgress] = useState(0);
  const [viewers, setViewers] = useState(null);

  useEffect(() => {
    api("/stories/" + authorId, { token: token }).then((d) => setStories(d.stories || [])).catch(() => setStories([]));
  }, [authorId, token]);

  const current = stories && stories[index];

  useEffect(() => {
    if (!current) return;
    api("/stories/" + current.id + "/view", { token: token, method: "POST" }).catch(() => {});
    setViewers(null);
    setProgress(0);
    if (current.mediaType === "video") return;
    const duration = 5000;
    const start = Date.now();
    const iv = setInterval(() => {
      const pct = Math.min(100, ((Date.now() - start) / duration) * 100);
      setProgress(pct);
      if (pct >= 100) {
        clearInterval(iv);
        next();
      }
    }, 100);
    return () => clearInterval(iv);
  }, [current && current.id]);

  const next = () => {
    if (!stories) return;
    if (index < stories.length - 1) setIndex(index + 1);
    else onClose();
  };
  const prev = () => { if (index > 0) setIndex(index - 1); };

  const loadViewers = () => {
    api("/stories/" + current.id + "/viewers", { token: token }).then((d) => setViewers(d.viewers)).catch(() => {});
  };

  if (!stories) return null;
  if (stories.length === 0) { onClose(); return null; }

  return h("div", { style: { position: "fixed", inset: 0, background: "#000", zIndex: 100, display: "flex", flexDirection: "column" } },
    h("div", { style: { display: "flex", gap: 4, padding: "10px 12px" } },
      stories.map((s, i) => h("div", { key: s.id, style: { flex: 1, height: 3, background: "rgba(255,255,255,0.3)", borderRadius: 2, overflow: "hidden" } },
        h("div", { style: { width: (i < index ? 100 : i === index ? progress : 0) + "%", height: "100%", background: colors.gold } })
      ))
    ),
    h("button", { onClick: onClose, style: { position: "absolute", top: 10, right: 14, background: "transparent", border: "none", color: "#fff", fontSize: 22, cursor: "pointer" } }, "✕"),
    h("div", { style: { flex: 1, position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }, onContextMenu: blockContextMenu },
      h("div", { onClick: prev, style: { position: "absolute", left: 0, top: 0, bottom: 0, width: "30%", zIndex: 5 } }),
      h("div", { onClick: next, style: { position: "absolute", right: 0, top: 0, bottom: 0, width: "30%", zIndex: 5 } }),
      current.mediaType === "video"
        ? h("video", { src: current.mediaUrl, autoPlay: true, onEnded: next, controls: false, disablePictureInPicture: true, onContextMenu: blockContextMenu, className: "media-protected", style: { maxHeight: "100%", maxWidth: "100%" } })
        : h("img", { src: current.mediaUrl, alt: "", draggable: false, onContextMenu: blockContextMenu, className: "media-protected", style: { maxHeight: "100%", maxWidth: "100%", objectFit: "contain" } })
    ),
    authorId === myUserId ? h("div", { style: { padding: 14 } },
      !viewers
        ? h("button", { className: "btn-ghost", onClick: loadViewers, style: Object.assign({}, toggleButton, { color: "#fff", borderColor: "rgba(255,255,255,0.3)" }) }, "Ver quién vio esto")
        : h("div", { style: { color: "#fff", fontSize: 13 } },
            h("p", { style: { margin: "0 0 6px", color: colors.muted } }, viewers.length + " vistas"),
            viewers.map((v) => h("p", { key: v.id, style: { margin: "2px 0" } }, "@" + v.username))
          )
    ) : null
  );
}

      })),
      options.length < 6 ? h("button", { className: "btn-ghost", onClick: addOption, style: Object.assign({}, toggleButton, { padding: "6px 12px", fontSize: 12, marginBottom: 10 }) }, "+ Agregar opción") : null,
      error ? h("p", { style: { color: colors.red, fontSize: 12 } }, error) : null,
      h("button", { className: "btn-primary", onClick: create, disabled: creating, style: Object.assign({}, primaryButton, { width: "100%" }) }, creating ? "Creando…" : "Publicar encuesta")
    ) : null,
    h("div", { style: { padding: "0 16px 20px" } },
      !polls ? h("p", { style: { color: colors.muted, textAlign: "center", marginTop: 20 } }, "Cargando…") :
      polls.length === 0 ? h("p", { style: { color: colors.muted, textAlign: "center", marginTop: 30 } }, "Todavía no hay encuestas.") :
      polls.map((p) => h(PollCard, { key: p.id, poll: p, token: token, onVoted: load }))
    )
  );
}


// ---------- Panel de suscriptores (top fans) ----------

function TopFansScreen(props) {
  const { token, onBack } = props;
  const [subscribers, setSubscribers] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    api("/payments/membership/subscribers", { token: token })
      .then((d) => setSubscribers(d.subscribers || []))
      .catch((e) => setError(e.message));
  }, [token]);

  return h("div", { style: { maxWidth: 480, margin: "0 auto" } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10, padding: 16 } },
      h("button", { className: "btn-ghost", onClick: onBack, style: Object.assign({}, toggleButton, { padding: "6px 10px" }) }, "←"),
      h("h2", { style: { color: colors.ink, fontFamily: "'Fraunces', serif", fontStyle: "italic", fontSize: 20, margin: 0 } }, "Mis suscriptores")
    ),
    error ? h("p", { style: { color: colors.red, fontSize: 13, padding: "0 16px" } }, error) : null,
    !subscribers ? h("p", { style: { color: colors.muted, textAlign: "center", marginTop: 30 } }, "Cargando…") :
    subscribers.length === 0 ? h("p", { style: { color: colors.muted, textAlign: "center", marginTop: 30 } }, "Todavía no tienes suscriptores activos.") :
    h("div", { style: { padding: "0 16px 20px" } },
      h("p", { style: { color: colors.muted, fontSize: 13, margin: "0 0 14px" } }, subscribers.length + " suscriptor" + (subscribers.length === 1 ? "" : "es") + " activo" + (subscribers.length === 1 ? "" : "s")),
      subscribers.map((s, i) => h("div", {
        key: s.id,
        style: { display: "flex", alignItems: "center", gap: 12, padding: "12px 0", borderBottom: "1px solid " + colors.borderSoft }
      },
        h("span", { style: { color: colors.gold, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, width: 22 } }, "#" + (i + 1)),
        h(Avatar, { url: s.avatarUrl, username: s.username, size: 40 }),
        h("div", { style: { flex: 1 } },
          h("p", { style: { color: colors.ink, fontSize: 14, margin: 0 } }, "@" + s.username),
          h("p", { style: { color: colors.muted, fontSize: 12, margin: "2px 0 0" } }, "Vence " + new Date(s.expiresAt).toLocaleDateString("es-SV"))
        )
      ))
    )
  );
}

function DeseoApp() {
  const [token, setToken] = useState(() => {
    try { return localStorage.getItem("deseo_token") || null; } catch (e) { return null; }
  });
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem("deseo_user") || "null"); } catch (e) { return null; }
  });
  const [checkingSession, setCheckingSession] = useState(!!token);
  const [posts, setPosts] = useState([]);
  const [view, setView] = useState("feed");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [profileUserId, setProfileUserId] = useState(null);
  const [chat, setChat] = useState(null);
  const [storyAuthorId, setStoryAuthorId] = useState(null);

  const openProfile = (id) => { setProfileUserId(id); setView("profile"); };
  const openChat = (conversationId, username, userId) => { setChat({ id: conversationId, username: username, userId: userId }); setView("chat"); };

  const persistSession = (t, u) => {
    setToken(t);
    setUser(u);
    try {
      localStorage.setItem("deseo_token", t);
      localStorage.setItem("deseo_user", JSON.stringify(u));
    } catch (e) {}
  };

  const logout = () => {
    try {
      localStorage.removeItem("deseo_token");
      localStorage.removeItem("deseo_user");
    } catch (e) {}
    setToken(null);
    setUser(null);
    setView("feed");
    setProfileUserId(null);
    setChat(null);
  };

  // Al abrir la app con una sesión guardada, confirmamos con el servidor que
  // el token siga siendo válido y traemos los datos de perfil actualizados
  // (por si cambió el avatar, bio, etc. desde otro dispositivo).
  useEffect(() => {
    if (!token) { setCheckingSession(false); return; }
    api("/auth/me", { token: token })
      .then((data) => persistSession(token, data.user))
      .catch(() => logout())
      .finally(() => setCheckingSession(false));
  }, []);

  const loadFeed = useCallback(async () => {
    if (!token) return;
    setLoading(true);
    setError("");
    try {
      const data = await api("/posts", { token: token });
      setPosts(data.posts || []);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }, [token]);

  useEffect(() => { if (token) loadFeed(); }, [token, loadFeed]);

  useEffect(() => {
    if (!token) return;
    const beat = () => api("/auth/heartbeat", { token: token, method: "POST" }).catch(() => {});
    beat();
    const iv = setInterval(beat, 25000);
    return () => clearInterval(iv);
  }, [token]);

  if (checkingSession) {
    return h("div", { style: { minHeight: "100vh", background: colors.bg, display: "flex", alignItems: "center", justifyContent: "center", color: colors.muted, fontSize: 14 } }, "Cargando…");
  }

  if (!token) {
    return h(AuthScreen, { onAuthed: (t, u) => persistSession(t, u) });
  }

  return h("div", { style: { background: colors.bg, minHeight: "100vh", fontFamily: "'Work Sans', sans-serif" } },
    h("div", {
      style: {
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "16px 22px", borderBottom: "1px solid " + colors.border,
        background: "linear-gradient(180deg, rgba(198,150,63,0.06), transparent)",
      }
    },
      h("div", { style: { display: "flex", alignItems: "baseline", gap: 12 } },
        h(Logo, { size: 23 }),
        h("span", { style: { color: colors.mutedDeep, fontSize: 11, letterSpacing: "0.1em" } }, "TU DESEO, TU PRECIO")
      ),
      h("div", { style: { display: "flex", alignItems: "center", gap: 14 } },
        h("button", {
          className: "btn-ghost", onClick: () => setView("polls"),
          style: { background: "transparent", border: "1px solid " + colors.border, borderRadius: 6, padding: "8px 10px", color: colors.ink, cursor: "pointer" }
        }, "📊"),
        h("button", {
          className: "btn-ghost", onClick: () => setView("search"),
          style: { background: "transparent", border: "1px solid " + colors.border, borderRadius: 6, padding: "8px 10px", color: colors.ink, cursor: "pointer" }
        }, "🔍"),
        h(NotificationBell, { token: token, onOpenProfile: openProfile }),
        h("button", {
          className: "btn-ghost", onClick: () => setView("inbox"),
          style: { background: "transparent", border: "1px solid " + colors.border, borderRadius: 6, padding: "8px 10px", color: colors.ink, cursor: "pointer" }
        }, "✉"),
        h("span", {
          style: { color: colors.muted, fontSize: 13, cursor: "pointer" },
          onClick: () => user && openProfile(user.id)
        }, "@" + (user && user.username)),
        h("button", {
          className: "btn-ghost", onClick: logout, title: "Cerrar sesión / cambiar de cuenta",
          style: { background: "transparent", border: "1px solid " + colors.border, borderRadius: 6, padding: "8px 10px", color: colors.muted, cursor: "pointer", fontSize: 12 }
        }, "Salir"),
        view === "feed"
          ? h("button", { className: "btn-primary", onClick: () => setView("create"), style: Object.assign({}, primaryButton, { margin: 0, padding: "10px 18px" }) }, "Publicar")
          : h("button", { className: "btn-ghost", onClick: () => setView("feed"), style: Object.assign({}, toggleButton, { padding: "10px 18px" }) }, "Volver al feed")
      )
    ),
    view === "feed"
      ? h("div", { style: { maxWidth: 480, margin: "0 auto" } },
          h(StoriesTray, { token: token, myUser: user, onOpenViewer: setStoryAuthorId }),
          storyAuthorId ? h(StoryViewer, { authorId: storyAuthorId, token: token, myUserId: user && user.id, onClose: () => setStoryAuthorId(null) }) : null,
          h("div", { style: { padding: "0 20px 20px" } },
          loading ? h("p", { style: { color: colors.muted, textAlign: "center" } }, "Cargando…") : null,
          error ? h("p", { style: { color: colors.red, textAlign: "center" } }, error) : null,
          (!loading && posts.length === 0) ? h("div", { style: { textAlign: "center", marginTop: 60 } },
            h("div", { style: { fontSize: 34, color: colors.gold, marginBottom: 12 } }, "◇"),
            h("p", { style: { color: colors.muted, fontSize: 14, fontFamily: "'Fraunces', serif", fontStyle: "italic" } }, "Todavía no hay publicaciones."),
            h("p", { style: { color: colors.mutedDeep, fontSize: 13 } }, "Sé la primera en publicar.")
          ) : null,
          posts.map((p) => h(PostCard, { key: p.id, post: p, token: token, onReacted: loadFeed, onOpenProfile: openProfile, myUserId: user && user.id }))
          )
        )
      : view === "create"
      ? h("div", { style: { maxWidth: 480, margin: "0 auto" } },
          h(CreatePostScreen, { token: token, onCancel: () => setView("feed"), onCreated: () => { setView("feed"); loadFeed(); } })
        )
      : view === "profile"
      ? h(ProfileScreen, {
          userId: profileUserId, token: token, currentUser: user, allPosts: posts,
          onBack: () => setView("feed"),
          onOpenChat: openChat,
          onOpenProfile: openProfile,
          onEditProfile: () => setView("editProfile"),
          onViewTopFans: () => setView("topFans")
        })
      : view === "chat" && chat
      ? h(ChatScreen, {
          conversationId: chat.id, otherUsername: chat.username, otherUserId: chat.userId, token: token, myUserId: user && user.id,
          onBack: () => setView("profile")
        })
      : view === "editProfile"
      ? h(EditProfileScreen, {
          token: token, user: user,
          onCancel: () => setView("profile"),
          onSaved: (updatedUser) => { persistSession(token, updatedUser); setView("profile"); }
        })
      : view === "inbox"
      ? h(InboxScreen, {
          token: token, myUserId: user && user.id,
          onBack: () => setView("feed"),
          onOpenChat: openChat
        })
      : view === "search"
      ? h(SearchScreen, {
          token: token,
          onBack: () => setView("feed"),
          onOpenProfile: openProfile
        })
      : view === "polls"
      ? h(PollsScreen, {
          token: token,
          onBack: () => setView("feed")
        })
      : view === "topFans"
      ? h(TopFansScreen, {
          token: token,
          onBack: () => setView("profile")
        })
      : null
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(DeseoApp));

</script>
</body>
</html>
